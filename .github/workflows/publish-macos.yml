name: Publish verified Mac downloads

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build macOS application run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.run_id }}
    steps:
      - name: Check build completed successfully
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('run.json'));if(r.conclusion!=='success'||r.name!=='Build macOS application'||r.event!=='workflow_dispatch')throw Error('Expected a successful manually requested Mac build');fs.appendFileSync(process.env.GITHUB_ENV,'BUILD_SHA='+r.head_sha+'\n')"
      - name: Read package version from tested source
        run: |
          gh api "repos/$GH_REPO/contents/package.json?ref=$BUILD_SHA" --jq .content | base64 --decode > package.json
          node -e "const fs=require('fs'),v=require('./package.json').version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error('Invalid version');fs.appendFileSync(process.env.GITHUB_ENV,'VERSION='+v+'\n')"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: SAA-mac-*
          merge-multiple: true
          path: downloads
      - name: Verify artifact checksums and publish
        run: |
          cd downloads
          sha256sum -c SHA256SUMS-arm64.txt
          sha256sum -c SHA256SUMS-x64.txt
          cat > notes.md <<'EOF'
          Ready-to-run Mac applications: no Node.js or source build required.

          Includes visible answer/code copy controls, local code highlighting, a privacy curtain, blocked remote reply images, a wider compact layout, and a saved-model overview in Settings. Existing provider credentials and conversations are retained when updating in place.

          - Apple Silicon (M-series): download the arm64 ZIP or DMG.
          - Intel Mac: download the x64 ZIP or DMG.

          Extract the ZIP to get SAA.app, move it to Applications, then open it. Alternatively, open the DMG and drag SAA to Applications.

          Both packages were built on matching GitHub Mac runners and passed shared tests, signature verification, packaged chat persistence/restart, and native passive input tests over a fullscreen Chromium fixture. The desktop check covers provider profiles/auth/validation, SSE, clipboard, opacity, compact mode, click-through, screen capture and mode switching. Enter your API settings again on the Mac; credentials and conversations are not bundled.

          Enable SAA in System Settings > Privacy & Security > Accessibility for passive fullscreen typing. Enable Screen & System Audio Recording for screen attachments. SAA includes setup buttons and detects permission changes. Restart if macOS asks. Physical-device checks are still needed for your browser, keyboard layout/IME, multiple displays and macOS version.

          These builds are ad-hoc signed, not Apple-notarized. If blocked on first launch, approve SAA in System Settings > Privacy & Security > Open Anyway. macOS ScreenCaptureKit recorders may capture the window despite exclusion being enabled; universal capture invisibility cannot be guaranteed. SAA hides its own panel briefly during its screen attachments to keep it out of the image.
          EOF
          gh release create "mac-v$VERSION" SAA-*-mac-*.zip SAA-*-mac-*.dmg SHA256SUMS-*.txt --target "$BUILD_SHA" --title "SAA $VERSION for macOS (Apple Silicon and Intel)" --notes-file notes.md --prerelease --latest=false
